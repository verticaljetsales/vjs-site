# Netlify configuration for the Vertical Jet Sales website.
# No build step: Netlify simply serves these files.

[build]
  publish = "."
  command = ""

# Nice URLs: /inventory instead of /inventory.html
[[redirects]]
  from = "/inventory"
  to = "/inventory.html"
  status = 200

[[redirects]]
  from = "/brokerage"
  to = "/brokerage.html"
  status = 200

[[redirects]]
  from = "/acquisition"
  to = "/acquisition.html"
  status = 200

[[redirects]]
  from = "/market-intelligence"
  to = "/market-intelligence.html"
  status = 200

# Never cache the inventory data — new listings appear immediately.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
