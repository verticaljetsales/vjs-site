# Netlify configuration for the Vertical Jet Sales website.
# No build step: Netlify serves these static files as-is.

[build]
  publish = "."
  command = ""

# Serve the data file as raw JSON, never cached, never redirected.
[[headers]]
  for = "/data/*"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-store"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
