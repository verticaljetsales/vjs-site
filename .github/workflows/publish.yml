name: Publish site (batched deploys)

# Publishes the live VJS site WITHOUT using Netlify's build system (which is
# intentionally "stopped" so that saving in the CMS no longer burns credits).
#
# How it works: GitHub Actions (free minutes) rebuilds the two data indexes and
# uploads the finished files straight to Netlify with the Netlify CLI — the
# "build locally + publish manually" path Netlify recommends when builds are
# stopped. Runs on a schedule (batched) and on demand (your "Publish Now" button).
#
# One-time setup (see docs/PUBLISHING.md):
#   • In Netlify: create a Personal Access Token (User settings → Applications).
#   • In GitHub: add it as a secret named NETLIFY_AUTH_TOKEN.
# The site ID below is public (it's in your Netlify URL) so it's fine in the file.

on:
  schedule:
    - cron: "0 12 * * *"     # 12:00 UTC ≈ 7:00 AM US-Central — morning publish
    - cron: "0 20 * * *"     # 20:00 UTC ≈ 3:00 PM US-Central — afternoon publish
  workflow_dispatch:          # the "Publish Now" button (Actions tab → Run workflow)

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: ef3c44e4-de53-4c24-a1a3-c9e334727a51
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Same two scripts Netlify used to run — regenerate the inventory and
      # content indexes so listings and the Content Studio stay in sync.
      - name: Rebuild data indexes
        run: |
          node build-index.js
          node build-content-index.js

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret is not set. Add it in GitHub →"
            echo "Settings → Secrets and variables → Actions (see docs/PUBLISHING.md)."
            exit 1
          fi
          echo "Uploading the finished site to Netlify…"
          npx --yes netlify-cli@17 deploy \
            --prod \
            --dir "." \
            --site "$NETLIFY_SITE_ID" \
            --message "Batched publish (${GITHUB_EVENT_NAME})"
          echo "Published. The site will be live in a minute or two."
