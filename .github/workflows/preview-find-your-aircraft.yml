name: Find Your Aircraft preview

# Draft deploy only. Never publishes the live site.
# Netlify builds are stopped, so a pull request does not create a preview
# unless this workflow uploads one. Production stays on the manual publish workflow.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'find-your-aircraft' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/find-your-aircraft')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_SITE_ID: ef3c44e4-de53-4c24-a1a3-c9e334727a51
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild data indexes
        run: |
          node build-index.js
          node build-content-index.js

      - name: Draft deploy (not production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret is not set, so a draft preview cannot be uploaded."
            exit 1
          fi
          # Guard: this job must never publish production.
          case " $* " in
            *" --prod "*|*" --prod="*) echo "::error::refusing production deploy"; exit 1 ;;
          esac
          npx --yes netlify-cli@17 deploy \
            --dir "." \
            --site "$NETLIFY_SITE_ID" \
            --message "Draft preview find-your-aircraft ${GITHUB_SHA}" \
            --json > deploy-out.txt
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("deploy-out.txt", "utf8");
            const i = raw.indexOf("{");
            if (i < 0) { console.log(raw); process.exit(1); }
            const j = JSON.parse(raw.slice(i));
            const deployUrl = j.deploy_url || "";
            const url = j.url || "";
            const id = j.deploy_id || j.id || "";
            fs.writeFileSync("deploy-meta.json", JSON.stringify({deploy_url: deployUrl, url, deploy_id: id}));
            console.log("DRAFT_DEPLOY_URL=" + deployUrl);
            console.log("DEPLOY_URL_FIELD=" + url);
            console.log("DEPLOY_ID=" + id);
            if (!deployUrl) process.exit(1);
            if (j.context && j.context === "production") {
              console.log("::error::deploy context was production");
              process.exit(1);
            }
          '

      - name: Check whether this project lists the form
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          node << 'NODE'
          const fs = require("fs");
          const meta = JSON.parse(fs.readFileSync("deploy-meta.json", "utf8"));
          const site = process.env.NETLIFY_SITE_ID;
          const token = process.env.NETLIFY_AUTH_TOKEN;
          (async () => {
            const headers = { Authorization: "Bearer " + token };
            let registered = false;
            for (let attempt = 1; attempt <= 6; attempt++) {
            const formsRes = await fetch("https://api.netlify.com/api/v1/sites/" + site + "/forms", { headers });
            const formsText = await formsRes.text();
            console.log("FORMS_HTTP=" + formsRes.status + " attempt=" + attempt);
            let forms = [];
            try { forms = JSON.parse(formsText); } catch (e) { console.log(formsText.slice(0, 500)); }
            if (!Array.isArray(forms)) {
              console.log("FORMS_BODY_NOT_ARRAY");
              console.log(String(formsText).slice(0, 500));
              break;
            }
            const brief = forms.map(f => ({
              name: f.name,
              id: f.id,
              submissions: f.submission_count,
              created_at: f.created_at
            }));
            console.log("FORMS=" + JSON.stringify(brief));
            registered = forms.some(f => f.name === "find-your-aircraft");
            console.log("FORM_REGISTERED=" + (registered ? "yes" : "no"));
            if (registered || attempt === 6) break;
            await new Promise(r => setTimeout(r, 10000));
          }
            const page = meta.deploy_url.replace(/\/$/, "") + "/find-your-aircraft/";
            const pageRes = await fetch(page);
            const html = await pageRes.text();
            console.log("PREVIEW_PAGE_HTTP=" + pageRes.status);
            console.log("PREVIEW_PAGE=" + page);
            console.log("PREVIEW_HAS_DATA_NETLIFY=" + html.includes('data-netlify="true"'));
            console.log("PREVIEW_HAS_FORM_NAME_INPUT=" + html.includes('name="form-name"'));
            console.log("PREVIEW_HAS_FORM_VALUE=" + html.includes('value="find-your-aircraft"'));
            console.log("PREVIEW_STILL_HAS_HUBSPOT=" + /hubspot|hsforms/i.test(html));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
