name: Publer — push approved posts

# Sends Approved Content Studio posts to Publer via the Publer API.
# Runs here (GitHub Actions) because it can reach Publer; the site itself can't.
#
# Two triggers:
#   • schedule  — runs automatically every morning and pushes any newly-Approved
#                 posts (no clicks needed).
#   • manual    — Actions tab → Run workflow → pick discover | dry-run | push.
#
# Setup secrets (Repo → Settings → Secrets and variables → Actions):
#   PUBLER_API_KEY        (Publer: Settings → Access & Login → API Keys)
#   PUBLER_WORKSPACE_ID   (from the "discover" run output)

on:
  schedule:
    - cron: "0 13 * * *"      # 13:00 UTC daily ≈ 8:00 AM US-Central — auto-push approved posts
  workflow_dispatch:
    inputs:
      mode:
        description: "discover | dry-run | push"
        required: true
        default: "discover"
        type: choice
        options: [discover, dry-run, push]

permissions:
  contents: write        # so "push" can mark items Scheduled and commit

jobs:
  publer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Scheduled runs have no input; default them to "push".
      - name: Determine mode
        run: echo "MODE=${{ github.event.inputs.mode || 'push' }}" >> "$GITHUB_ENV"

      - name: Run Publer tool
        env:
          PUBLER_API_KEY: ${{ secrets.PUBLER_API_KEY }}
          PUBLER_WORKSPACE_ID: ${{ secrets.PUBLER_WORKSPACE_ID }}
        run: |
          case "$MODE" in
            discover) node tools/publer-push.cjs --discover ;;
            dry-run)  node tools/publer-push.cjs --dry-run ;;
            *)        node tools/publer-push.cjs ;;
          esac

      - name: Commit status changes (push mode only)
        if: env.MODE == 'push'
        run: |
          if [ -n "$(git status --porcelain data/content)" ]; then
            git config user.name  "vjs-content-bot"
            git config user.email "bot@verticaljetsales.com"
            git add data/content
            git commit -m "Publer: mark pushed posts as Scheduled"
            git push
          else
            echo "No status changes to commit."
          fi
